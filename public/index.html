<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>和吴玉清聊天</title>
<style>
  :root {
    --bg: #0f0f0f;
    --chat-bg: #1a1a1a;
    --bubble-self: #2a3a4a;
    --bubble-other: #252525;
    --text: #e0e0e0;
    --muted: #777;
    --accent: #7cafc2;
    --border: #2a2a2a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif;
    background: var(--bg); color: var(--text); height: 100dvh;
    display: flex; flex-direction: column; max-width: 600px; margin: 0 auto;
  }
  header {
    padding: 0.8rem 1rem; background: var(--chat-bg);
    border-bottom: 1px solid var(--border); text-align: center;
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 1rem; font-weight: 600; }
  header .sub { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
  .status { color: #5a5; font-size: 0.7rem; }

  #messages {
    flex: 1; overflow-y: auto; padding: 1rem;
    display: flex; flex-direction: column; gap: 0.6rem;
  }
  .msg {
    max-width: 82%; padding: 0.6rem 0.9rem; border-radius: 16px;
    font-size: 0.92rem; line-height: 1.6; word-break: break-word;
    animation: fadeIn 0.25s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .msg.user {
    align-self: flex-end; background: #2a4a5a;
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-start; background: var(--bubble-other);
    border-bottom-left-radius: 4px;
  }
  .msg .time { font-size: 0.65rem; color: var(--muted); margin-top: 0.3rem; text-align: right; }

  .typing {
    align-self: flex-start; background: var(--bubble-other);
    padding: 0.6rem 1rem; border-radius: 16px 16px 16px 4px;
    display: flex; gap: 4px;
  }
  .typing span {
    width: 6px; height: 6px; background: var(--muted);
    border-radius: 50%; animation: bounce 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%,60%,100% { transform: translateY(0); }
    30% { transform: translateY(-6px); }
  }

  form {
    display: flex; gap: 0.5rem; padding: 0.8rem;
    background: var(--chat-bg); border-top: 1px solid var(--border);
    position: sticky; bottom: 0;
  }
  input {
    flex: 1; padding: 0.7rem 1rem; border-radius: 24px;
    border: 1px solid var(--border); background: #222;
    color: var(--text); font-size: 0.92rem; outline: none;
  }
  input:focus { border-color: var(--accent); }
  button {
    width: 44px; height: 44px; border-radius: 50%; border: none;
    background: var(--accent); color: #0f0f0f; font-size: 1.2rem;
    cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  }
  button:disabled { opacity: 0.4; cursor: default; }

  .welcome {
    text-align: center; padding: 2rem 1rem; color: var(--muted);
  }
  .welcome .avatar { font-size: 3rem; margin-bottom: 0.5rem; }
  .welcome p { font-size: 0.85rem; margin: 0.3rem 0; }
  .hints { display: flex; flex-wrap: wrap; gap: 0.4rem; justify-content: center; margin-top: 1rem; }
  .hint {
    background: #222; border: 1px solid var(--border);
    padding: 0.4rem 0.9rem; border-radius: 16px; font-size: 0.8rem;
    color: var(--muted); cursor: pointer; transition: 0.2s;
  }
  .hint:hover { border-color: var(--accent); color: var(--text); }

  .reset-btn {
    background: none; border: none; color: var(--muted); font-size: 0.7rem;
    cursor: pointer; position: absolute; right: 1rem; top: 50%; transform: translateY(-50%);
  }
  header { position: relative; }
</style>
</head>
<body>

<header>
  <h1>吴玉清 <span style="color:var(--muted);font-weight:400;">/ O.o</span></h1>
  <div class="sub">19岁 · 北化大一 · ISFJ</div>
  <div class="status" id="status">● 在线</div>
  <button class="reset-btn" onclick="resetChat()" title="重新开始">重新开始</button>
</header>

<div id="messages">
  <div class="welcome" id="welcome">
    <div class="avatar">🤔</div>
    <p>我是吴玉清（O.o）</p>
    <p>聊聊？但别指望我话多</p>
    <div class="hints">
      <span class="hint" onclick="sendHint(this.textContent)">高中当课代表的时候</span>
      <span class="hint" onclick="sendHint(this.textContent)">大学怎么样</span>
      <span class="hint" onclick="sendHint(this.textContent)">你生气的时候什么样</span>
      <span class="hint" onclick="sendHint(this.textContent)">熬夜的事</span>
    </div>
  </div>
</div>

<form id="form" onsubmit="sendMsg(event)">
  <input id="input" type="text" placeholder="说点什么…" autocomplete="off" autofocus>
  <button type="submit" id="sendBtn">↑</button>
</form>

<script>
let sessionId = Date.now().toString(36) + Math.random().toString(36).slice(2,6);

function resetChat() {
  sessionId = Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  document.getElementById("messages").innerHTML = document.getElementById("welcome").outerHTML;
}

function sendHint(text) {
  document.getElementById("input").value = text;
  sendMsg(new Event("submit"));
}

function addMsg(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.innerHTML = text + `<div class="time">${new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"})}</div>`;
  document.getElementById("messages").appendChild(div);
  document.getElementById("messages").scrollTop = document.getElementById("messages").scrollHeight;
}

function showTyping() {
  const div = document.createElement("div");
  div.className = "typing";
  div.id = "typing";
  div.innerHTML = "<span></span><span></span><span></span>";
  document.getElementById("messages").appendChild(div);
  document.getElementById("messages").scrollTop = document.getElementById("messages").scrollHeight;
}

function hideTyping() {
  const el = document.getElementById("typing");
  if (el) el.remove();
}

async function sendMsg(e) {
  e.preventDefault();
  const input = document.getElementById("input");
  const msg = input.value.trim();
  if (!msg) return;

  const w = document.getElementById("welcome");
  if (w) w.remove();

  input.value = "";
  document.getElementById("sendBtn").disabled = true;
  addMsg("user", msg);
  showTyping();

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: msg, sessionId }),
    });
    const data = await res.json();
    hideTyping();
    if (data.error) {
      addMsg("bot", "…出错了：" + data.error);
    } else {
      addMsg("bot", data.reply);
    }
  } catch (err) {
    hideTyping();
    addMsg("bot", "…网络好像有问题 " + err.message);
  }
  document.getElementById("sendBtn").disabled = false;
  input.focus();
}
</script>
</body>
</html>
